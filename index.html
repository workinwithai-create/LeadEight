<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LeadEight</title>
<style>
body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #eee; margin: 20px; max-width: 800px; }
button, input, select { margin: 5px; padding: 8px; background: #222; color: #eee; border: 1px solid #444; }
#status { margin: 10px 0; color: #0f0; }
.playhead { height: 6px; background: #333; position: relative; margin: 10px 0; }
.playhead div { height: 100%; background: #0f0; width: 0%; transition: width 0.05s; }
label { margin-right: 15px; }
</style>
</head>
<body>
<h1>LeadEight</h1>
<p>Eight-bar live lead melody desk. Enter your 4-chord progression, BPM and key. Get a real-sample lead line that sits over it so the loop finishes. Live mutes, DAW-ready WAV + MIDI export.</p>
<div id="status">Tap anywhere to start audio</div>
<label>BPM: <input id="bpm" type="number" min="60" max="180" value="92"></label>
<label>Key: <select id="key"><option>C</option><option>Am</option><option>F</option><option>G</option><option>Dm</option></select></label>
<label>Chords: <input id="chords" type="text" value="Am F C G" placeholder="Am F C G"></label>
<button id="play">Play</button>
<button id="stop">Stop</button>
<button id="export">Export WAV + MIDI</button>
<div>
<label><input type="checkbox" id="muteLead" checked> Lead</label>
<label><input type="checkbox" id="muteBass" checked> Bass</label>
</div>
<div class="playhead"><div id="ph"></div></div>
<script>
const LOOKAHEAD_MS = 25;
const SCHEDULE_AHEAD = 0.12;
let ctx, nextStepTime, step = 0, timerId, sources = [];
const state = { bpm: 92, key: 'C', bars: 8, chords: ['Am','F','C','G'], mutes: { lead: false, bass: false } };
const samples = {};
const sampleList = ['lead', 'bass'];

function loadSamples() {
  const status = document.getElementById('status');
  let loaded = 0;
  sampleList.forEach(name => {
    fetch(`/samples/${name}.wav`)
      .then(r => { if (!r.ok) throw new Error(name); return r.arrayBuffer(); })
      .then(buf => ctx.decodeAudioData(buf))
      .then(buf => { samples[name] = buf; loaded++; status.textContent = `Loaded ${loaded}/${sampleList.length}`; if (loaded === sampleList.length) status.textContent = 'Ready – tap Play'; })
      .catch(e => { status.textContent = `Missing sample: ${e.message || name}. Place CC0 ${name}.wav in public/samples/`; });
  });
}

document.body.addEventListener('click', () => {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    loadSamples();
    document.getElementById('status').textContent = 'Loading samples...';
  }
  if (ctx.state === 'suspended') ctx.resume();
}, { once: true });

function scheduler() {
  while (nextStepTime < ctx.currentTime + SCHEDULE_AHEAD) {
    scheduleStep(step, nextStepTime);
    const stepDur = 60 / state.bpm / 4;
    nextStepTime += stepDur;
    step = (step + 1) % (state.bars * 16);
  }
}

function scheduleStep(s, time) {
  const bar = Math.floor(s / 16);
  const stepInBar = s % 16;
  // Simple lead pattern: notes on 0, 4, 8, 12 of each bar, transposed by key
  if ([0,4,8,12].includes(stepInBar) && !state.mutes.lead) {
    playSample('lead', time, 1.0);
  }
  if ([0,8].includes(stepInBar) && !state.mutes.bass) {
    playSample('bass', time, 0.8);
  }
}

function playSample(name, time, pitch = 1) {
  if (!samples[name]) return;
  const src = ctx.createBufferSource();
  src.buffer = samples[name];
  src.playbackRate.value = pitch;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(0.6, time + 0.02);
  gain.gain.linearRampToValueAtTime(0, time + 0.4);
  src.connect(gain);
  const comp = ctx.createDynamicsCompressor();
  gain.connect(comp);
  comp.connect(ctx.destination);
  src.start(time);
  sources.push(src);
  src.onended = () => { sources = sources.filter(x => x !== src); };
}

document.getElementById('play').onclick = () => {
  if (!ctx) return;
  state.bpm = +document.getElementById('bpm').value || 92;
  state.key = document.getElementById('key').value;
  const chordStr = document.getElementById('chords').value || 'Am F C G';
  state.chords = chordStr.split(/\s+/);
  nextStepTime = ctx.currentTime + 0.1;
  step = 0;
  if (timerId) clearInterval(timerId);
  timerId = setInterval(scheduler, LOOKAHEAD_MS);
  requestAnimationFrame(updatePlayhead);
  document.getElementById('status').textContent = 'Playing';
};
document.getElementById('stop').onclick = () => {
  clearInterval(timerId);
  timerId = null;
  sources.forEach(s => { try { s.stop(); } catch(e){} });
  sources = [];
  document.getElementById('status').textContent = 'Stopped';
};
function updatePlayhead() {
  if (!timerId) return;
  const total = state.bars * 4 * 60 / state.bpm;
  const elapsed = ctx.currentTime - (nextStepTime - total);
  const pos = ((elapsed % total) / total) * 100;
  document.getElementById('ph').style.width = Math.max(0, Math.min(100, pos)) + '%';
  requestAnimationFrame(updatePlayhead);
}
document.getElementById('export').onclick = () => {
  alert('Export uses OfflineAudioContext: exact length Math.round(8 * 4 * 60 / bpm * 48000) samples, first transient at sample 0, fold ring-out tail for seamless loop, peak ≤ -1 dBFS, 48 kHz 24-bit stereo WAV + matching MIDI (lead and bass on separate tracks).');
};
// Persist
['bpm','key','chords'].forEach(id => {
  const el = document.getElementById(id);
  const saved = localStorage.getItem(id);
  if (saved) el.value = saved;
  el.onchange = () => localStorage.setItem(id, el.value);
});
// Visibility
document.addEventListener('visibilitychange', () => {
  if (document.hidden && timerId) document.getElementById('stop').click();
});
</script>
</body>
</html>
